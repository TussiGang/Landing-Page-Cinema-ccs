<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema - Productos y contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <section id="productos">
            <h1>Productos o servicios</h1>
            <p class="subtitulo">PRODUCTOS DE NUESTRO CINEMA</p>

            <table>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                </tr>
                <tr>
                    <td>Crispetas grandes</td>
                    <td>$100.000</td>
                </tr>
                <tr>
                    <td>Gaseosa</td>
                    <td>$80.000</td>
                </tr>
                <tr>
                    <td>Perro caliente</td>
                    <td>$235.000</td>
                </tr>
                <tr>
                    <td>Nachos con queso</td>
                    <td>$15.000</td>
                </tr>
                <tr>
                    <td>Combo de cine</td>
                    <td>$25.000</td>
                </tr>
                <tr>
                    <td>Combo de cine con gaseosa</td>
                    <td>$30.000</td>
                </tr>
                <tr>
                    <td>Chocolates</td>
                    <td>$10.000</td>
                </tr>
            </table>

            <h2>Galería de imágenes</h2>
            <div class="galeria">
                <img src="https://img.magnific.com/vector-gratis/fondo-sala-cine_1017-8728.jpg?semt=ais_hybrid&w=740&q=80" alt="Sala de cine">
                <img src="https://img.lalr.co/cms/2025/02/27064736/Cinemas-Procinal.jpg?size=xl" alt="Interior de un cinema">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZ6jTYDIaMCBB2f9HQ__q_Mlg9-kuZO5f1T_ABvY2DlCSrJ8_LapXoMHs&s=10" alt="Imagen relacionada con el cine">
                <img src="https://images.adsttc.com/media/images/5f7d/fef2/63c0/170a/9100/0273/large_jpg/Jiangnan_Photography.jpg?1602092773" alt="Arquitectura de una sala de cine">
            </div>
        </section>

        <hr>

        <section id="contacto">
            <h2>Contáctanos</h2>
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Ingrese su nombre" required>

                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="Ingrese su correo electrónico" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje"
                          placeholder="Escriba su mensaje" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
